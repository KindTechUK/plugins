[project]
name = "kindtech-plugins"
version = "0.1.0"
description = "Checks and build scripts for the Kindtech plugins repository"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12.0",
    "skills-ref>=0.1.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ERA"]

[tool.ruff.lint.isort]
known-first-party = ["build_chatgpt_archive", "lint_skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
